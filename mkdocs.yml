site_name: Outward Mods — Beastwhispering & Kits
site_description: User-facing documentation for the Beastwhispering Outward mod and the shared kit family.
site_url: https://cobalt-craft.github.io/outward-mods-wiki/
repo_url: https://github.com/cobalt-craft/outward-mods-wiki
edit_uri: ""

# docs_dir defaults to ./docs. Navigation is auto-generated from the file tree,
# so the sync from the source repo can add/remove pages without touching this file.
# MkDocs treats docs/README.md as the site index.

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search
